# ray-podmonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ray-pods
  namespace: ray
  labels:
    release: monitoring   # must match your kube-prometheus-stack release
spec:
  namespaceSelector:
    matchNames: [ray]
  selector:
    matchLabels:
      ray.io/is-ray-node: "yes"   # all Ray pods KubeRay creates have this
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
