apiVersion: v1
kind: Namespace
metadata:
  name: ray
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-latest
  namespace: ray
spec:
  rayVersion: "2.51.1"

  # ====== Head Pod Configuration ======
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        nodeSelector:
          kubernetes.io/hostname: eq-01
        volumes: # <-- This is correctly placed
          - name: checkpoint-storage
            persistentVolumeClaim:
              claimName: ray-checkpoint-pvc
        containers:
          - name: ray-head
            image: "rayproject/ray:2.51.1-py311"
            ports:
              - name: gcs
                containerPort: 6379
              - name: dashboard
                containerPort: 8265
              - name: client
                containerPort: 10001
              - name: serve
                containerPort: 8000
            resources:
              requests:
                cpu: "1"
                memory: "2Gi"
              limits:
                cpu: "2"
                memory: "4Gi"
            env:
              - name: RAY_GRAFANA_IFRAME_HOST
                value: http://127.0.0.1:3000
              - name: RAY_GRAFANA_HOST
                value: http://monitoring-grafana.monitoring.svc:80
              - name: RAY_PROMETHEUS_HOST
                value: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
            volumeMounts: # <-- Mount the volume in the head container
              - mountPath: /mnt/ray_checkpoints
                name: checkpoint-storage

  # ====== Worker Pod Configurations ======
  workerGroupSpecs:

    # --- Worker Group 1: GPU worker ---
    - groupName: gpu-worker-group
      replicas: 2
      minReplicas: 1
      maxReplicas: 5
      rayStartParams: {}
      template:
        spec:
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          volumes: # <-- This is correctly placed
            - name: checkpoint-storage
              persistentVolumeClaim:
                claimName: ray-checkpoint-pvc
          containers:
            - name: ray-gpu-worker
              image: "rayproject/ray:2.51.1-py311-gpu"
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh","-c","ray stop"]
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "4"
                  memory: "8Gi"
                  nvidia.com/gpu: "1"
              volumeMounts: # <-- Mount the volume in the GPU worker container
                - mountPath: /mnt/ray_checkpoints
                  name: checkpoint-storage

    # --- Worker Group 2: The CPU worker ---
    - groupName: cpu-worker-group
      replicas: 2
      minReplicas: 1
      maxReplicas: 5
      rayStartParams: {}
      template:
        spec:
          volumes: # <-- This is correctly placed
            - name: checkpoint-storage
              persistentVolumeClaim:
                claimName: ray-checkpoint-pvc
          containers:
            - name: ray-cpu-worker
              image: "rayproject/ray:2.51.1-py311"
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh","-c","ray stop"]
              resources:
                requests:
                  cpu: "2"
                  memory: "8Gi"
                limits:
                  cpu: "4"
                  memory: "16Gi"
              volumeMounts: # <-- Mount the volume in the CPU worker container
                - mountPath: /mnt/ray_checkpoints
                  name: checkpoint-storage